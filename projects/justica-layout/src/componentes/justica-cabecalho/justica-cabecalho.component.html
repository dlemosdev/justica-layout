<header class="justica-cabecalho" role="banner">
  <div class="justica-cabecalho__marca-bloco">
    <div class="justica-cabecalho__marca">
      <img [src]="logo()" alt="Logo institucional" class="justica-cabecalho__logo" />
    </div>

    <button
      type="button"
      class="justica-cabecalho__botao-menu"
      [class.justica-cabecalho__botao-menu--aberto]="barraLateralAberta()"
      aria-label="Alternar barra lateral"
      (click)="emitirAlternanciaBarraLateral()">
      <i class="justica-cabecalho__icone-seta fa-solid fa-chevron-right" aria-hidden="true"></i>
    </button>
  </div>

  <div class="justica-cabecalho__conteudo">
    <div class="justica-cabecalho__acoes-inicio">
      <div class="justica-cabecalho__titulo">
        <strong>{{ titulo() }}</strong>
        @if (versao()) {
          <span>{{ versao() }}</span>
        }
      </div>
    </div>

    <div class="justica-cabecalho__acoes-fim">
      <span class="justica-cabecalho__relogio">{{ relogioCabecalho() }}</span>
      <ng-content></ng-content>
      <button
        type="button"
        class="justica-cabecalho__botao-acao"
        aria-label="Notificacoes"
        (click)="emitirAcaoCabecalho('notificacoes')">
        <i class="fa-solid fa-bell" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        class="justica-cabecalho__botao-acao"
        aria-label="Alertas"
        (click)="emitirAcaoCabecalho('alertas')">
        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        class="justica-cabecalho__botao-acao"
        aria-label="Sair"
        (click)="emitirAcaoCabecalho('sair')">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>
